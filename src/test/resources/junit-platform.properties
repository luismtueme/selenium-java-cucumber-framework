# Cucumber settings for RunCucumberIT. System properties override these, for example
#   ./mvnw verify -Dcucumber.filter.tags="@Smoke"
# The pom passes the tag filter, dry-run and parallelism (-Dworkers=N) through the failsafe plugin.
cucumber.glue=io.github.luismtueme.acceptance
# The pom passes cucumber.plugin (summary + HTML report); this default applies when running from an IDE
cucumber.plugin=summary, html:target/cucumber-report.html
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase

# Scenarios run in parallel, each with its own browser
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Report each scenario as a test named after it (not "Example #1.1") in Maven's output and XML reports
cucumber.junit-platform.naming-strategy=long
