# Non-secret defaults. Environment variables, -D system properties and .env override these.
# Every variable is documented in .env.example.
TEST_ENV=local
TEST_BROWSER=chrome
# Show the browser on local runs. CI (CI=true) always runs headless.
HEADLESS_DEFAULT=false
WINDOW_SIZE=1280x720
# Milliseconds
WAIT_TIMEOUT=10000
PAGE_LOAD_TIMEOUT=30000
DEMO_APP_PORT=4173
